<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CYBERROVER X4.3 // Modular Dual-Layer Autonomous Exploration UGV</title>
    <meta name="description" content="CyberRover X4.3 — Modular Dual-Layer Autonomous Exploration & Environmental Scouting UGV for Hazardous Mine & Disaster Reconnaissance. Built by Veer Pratap Saw." />
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700;800;900&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script>
      window.onerror = function(msg, url, lineNo, columnNo, error) {
        var errText = 'JS ERROR: ' + msg + ' at ' + url + ':' + lineNo + ':' + columnNo + '\n' + (error && error.stack ? error.stack : '');
        console.error(errText);
        try {
          fetch('/__client_error', { method: 'POST', body: errText });
        } catch(e){}
        var banner = document.createElement('div');
        banner.style.cssText = 'position:fixed;top:0;left:0;right:0;background:#ff0033;color:#fff;padding:16px;z-index:9999999;font-family:monospace;font-size:14px;white-space:pre-wrap;box-shadow:0 4px 20px rgba(0,0,0,0.5);';
        banner.innerText = errText;
        document.body.appendChild(banner);
      };
      window.addEventListener('unhandledrejection', function(event) {
        var errText = 'UNHANDLED PROMISE REJECTION: ' + (event.reason && event.reason.stack ? event.reason.stack : event.reason);
        console.error(errText);
        try {
          fetch('/__client_error', { method: 'POST', body: errText });
        } catch(e){}
        var banner = document.createElement('div');
        banner.style.cssText = 'position:fixed;top:60px;left:0;right:0;background:#cc0022;color:#fff;padding:16px;z-index:9999999;font-family:monospace;font-size:14px;white-space:pre-wrap;box-shadow:0 4px 20px rgba(0,0,0,0.5);';
        banner.innerText = errText;
        document.body.appendChild(banner);
      });
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
